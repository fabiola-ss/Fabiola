# Configuração do Netlify.
#
# Site estático, sem etapa de build: o que está na raiz do repositório é
# exatamente o que vai ao ar. Publicar direto da raiz é de propósito — assim
# não é preciso mover nenhum arquivo de lugar para atualizar o site.

[build]
  publish = "."

# Os vídeos são imutáveis: se o conteúdo mudar, o nome do arquivo muda junto.
# Então podem ficar um ano em cache, e quem já visitou não baixa de novo.
[[headers]]
  for = "/*.webm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# A fonte e o CSS vivem dentro do index.html, então não há mais nada a
# cachear. O HTML fica fora desta lista de propósito: o Netlify revalida
# HTML a cada visita, e é isso que faz suas edições aparecerem na hora.
